"Enter a period as 2026-07-18 to 2026-08-30, or for every year as 07-18 to 08-30. School lines do not run in the school holidays; on public holidays the Sunday timetable runs.":
  nl: "Voer een periode in als 2026-07-18 tot 2026-08-30, of voor elk jaar als 07-18 tot 08-30. Schoollijnen rijden niet in de schoolvakanties; op feestdagen rijdt de zondagsdienstregeling."
  de: "Geben Sie einen Zeitraum als 2026-07-18 bis 2026-08-30 ein, oder für jedes Jahr als 07-18 bis 08-30. Schullinien fahren nicht in den Schulferien; an Feiertagen gilt der Sonntagsfahrplan."
  fr: "Saisissez une période comme 2026-07-18 au 2026-08-30, ou pour chaque année comme 07-18 au 08-30. Les lignes scolaires ne circulent pas pendant les vacances scolaires ; les jours fériés, l'horaire du dimanche s'applique."
  pl: "Wpisz okres jako 2026-07-18 do 2026-08-30 lub dla każdego roku jako 07-18 do 08-30. Linie szkolne nie kursują w ferie i wakacje; w święta obowiązuje rozkład niedzielny."
  ru: "Введите период как 2026-07-18 – 2026-08-30 или для каждого года как 07-18 – 08-30. Школьные линии не работают в каникулы; в праздники действует воскресное расписание."
  uk: "Введіть період як 2026-07-18 – 2026-08-30 або для кожного року як 07-18 – 08-30. Шкільні лінії не працюють у канікули; у свята діє недільний розклад."
