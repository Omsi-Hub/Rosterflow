  pl: "Kursy tej linii są edytowane pojedynczo w Timeplan: poniższe odjazdy obowiązują dopiero po przełączeniu z powrotem."
  ru: "Рейсы этой линии правятся по одному в Timeplan: отправления ниже снова действуют только после обратного переключения."
  uk: "Рейси цієї лінії редагуються по одному в Timeplan: відправлення нижче знову діють лише після зворотного перемикання."
