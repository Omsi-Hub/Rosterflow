"An example company with three lines, twelve buses and thirty-one employees, to try everything on. Every name is made up.":
  nl: "Een voorbeeldbedrijf met drie lijnen, twaalf bussen en eenendertig medewerkers, om alles op uit te proberen. Alle namen zijn verzonnen."
  de: "Ein Beispielunternehmen mit drei Linien, zwölf Bussen und einunddreißig Beschäftigten, um alles auszuprobieren. Alle Namen sind erfunden."
  fr: "Une entreprise d'exemple avec trois lignes, douze bus et trente et un employés, pour tout essayer. Tous les noms sont inventés."
  pl: "Przykładowa firma z trzema liniami, dwunastoma autobusami i trzydziestoma jeden pracownikami, aby wszystko wypróbować. Wszystkie nazwiska są zmyślone."
  ru: "Пример компании с тремя линиями, двенадцатью автобусами и тридцатью одним сотрудником, чтобы всё попробовать. Все имена вымышлены."
  uk: "Приклад компанії з трьома лініями, дванадцятьма автобусами та тридцятьма одним працівником, щоб усе спробувати. Усі імена вигадані."
