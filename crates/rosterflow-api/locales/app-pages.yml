"Welcome! Make your company to begin: enter its stops, lines, buses and drivers, and RosterFlow plans the blocks, the duties and the roster. Or try everything first on an example company.":
  nl: "Welkom! Maak je bedrijf aan om te beginnen: voer de haltes, lijnen, bussen en chauffeurs in, en RosterFlow plant de omlopen, de diensten en het rooster. Of probeer eerst alles uit op een voorbeeldbedrijf."
  de: "Willkommen! Legen Sie Ihr Unternehmen an: geben Sie Haltestellen, Linien, Busse und Fahrer ein, und RosterFlow plant die Umläufe, die Dienste und den Dienstplan. Oder probieren Sie zuerst alles an einem Beispielunternehmen aus."
  fr: "Bienvenue ! Créez votre entreprise pour commencer : saisissez ses arrêts, lignes, bus et conducteurs, et RosterFlow planifie les services véhicules, les services conducteurs et le roulement. Ou essayez d'abord tout sur une entreprise d'exemple."
  pl: "Witamy! Utwórz firmę, aby zacząć: wpisz przystanki, linie, autobusy i kierowców, a RosterFlow zaplanuje obiegi, służby i grafik. Albo najpierw wypróbuj wszystko na przykładowej firmie."
  ru: "Добро пожаловать! Создайте компанию: введите остановки, линии, автобусы и водителей, и RosterFlow спланирует выходы, смены и график. Или сначала попробуйте всё на примере компании."
  uk: "Ласкаво просимо! Створіть компанію: введіть зупинки, лінії, автобуси та водіїв, і RosterFlow спланує випуски, зміни та графік. Або спершу спробуйте все на прикладі компанії."
"Where the buses start and end their day: the empty runs of the lines go from and to it.":
  nl: "Waar de bussen hun dag beginnen en eindigen: de leegritten van de lijnen gaan ervandaan en erheen."
  de: "Wo die Busse ihren Tag beginnen und beenden: die Leerfahrten der Linien gehen von dort und dorthin."
  fr: "Où les bus commencent et finissent leur journée : les haut-le-pied des lignes en partent et y reviennent."
  pl: "Gdzie autobusy zaczynają i kończą dzień: przejazdy techniczne linii prowadzą stąd i tutaj."
