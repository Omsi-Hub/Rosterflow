"Take %{name} out of the staff? To keep their history, give them a last working day instead.":
  nl: "%{name} uit het personeel halen? Geef liever een laatste werkdag op om de geschiedenis te bewaren."
  de: "%{name} aus dem Personal entfernen? Um die Historie zu behalten, geben Sie besser einen letzten Arbeitstag an."
  fr: "Retirer %{name} du personnel ? Pour garder son historique, indiquez plutôt un dernier jour de travail."
  pl: "Usunąć %{name} z personelu? Aby zachować historię, lepiej podaj ostatni dzień pracy."
  ru: "Убрать %{name} из персонала? Чтобы сохранить историю, лучше укажите последний рабочий день."
  uk: "Прибрати %{name} з персоналу? Щоб зберегти історію, краще вкажіть останній робочий день."
"Take bus %{n} out of the fleet? To keep its history, give it a last day instead.":
  nl: "Bus %{n} uit de vloot halen? Geef liever een laatste dag op om de geschiedenis te bewaren."
  de: "Bus %{n} aus der Flotte entfernen? Um die Historie zu behalten, geben Sie besser einen letzten Tag an."
  fr: "Retirer le bus %{n} de la flotte ? Pour garder son historique, indiquez plutôt un dernier jour."
  pl: "Usunąć autobus %{n} z floty? Aby zachować historię, lepiej podaj ostatni dzień."
  ru: "Убрать автобус %{n} из парка? Чтобы сохранить историю, лучше укажите последний день."
  uk: "Прибрати автобус %{n} з парку? Щоб зберегти історію, краще вкажіть останній день."
"Take line %{n} out of the network? Its tours leave the roster.":
  nl: "Lijn %{n} uit het netwerk halen? Haar omlopen verdwijnen uit het rooster."
  de: "Linie %{n} aus dem Netz entfernen? Ihre Umläufe verschwinden aus dem Dienstplan."
  fr: "Retirer la ligne %{n} du réseau ? Ses services quittent le roulement."
  pl: "Usunąć linię %{n} z sieci? Jej obiegi znikną z grafiku."
  ru: "Убрать линию %{n} из сети? Её выходы исчезнут из графика."
  uk: "Прибрати лінію %{n} з мережі? Її випуски зникнуть із графіка."
