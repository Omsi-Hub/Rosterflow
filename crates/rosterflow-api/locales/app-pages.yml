  fr: "Les règles de temps de travail (durée des services, pauses, repos entre services) sont les préférences de RosterFlow : ouvrez la Planification et choisissez Préférences."
  pl: "Zasady czasu pracy (długość służby, przerwy, odpoczynek między służbami) to preferencje RosterFlow: otwórz Planowanie i wybierz Preferencje."
  ru: "Правила рабочего времени (длина смены, перерывы, отдых между сменами) — это настройки RosterFlow: откройте Планирование и выберите Настройки."
  uk: "Правила робочого часу (тривалість зміни, перерви, відпочинок між змінами) — це налаштування RosterFlow: відкрийте Планування й оберіть Налаштування."
