"The trips of this line are edited one by one in the Timeplan: the departures below are used again only when you switch back.":
  nl: "De ritten van deze lijn worden één voor één bewerkt in de Timeplan: de vertrektijden hieronder gelden pas weer als je terugschakelt."
  de: "Die Fahrten dieser Linie werden einzeln im Timeplan bearbeitet: die Abfahrten unten gelten erst wieder, wenn Sie zurückschalten."
