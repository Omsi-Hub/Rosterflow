"The company is saved after every change. A copy of each day it changed is kept for 30 days.":
  nl: "Het bedrijf wordt na elke wijziging opgeslagen. Van elke dag waarop het veranderde, blijft 30 dagen een kopie bewaard."
  de: "Das Unternehmen wird nach jeder Änderung gespeichert. Von jedem Tag mit Änderungen wird 30 Tage lang eine Kopie aufbewahrt."
  fr: "L'entreprise est enregistrée après chaque modification. Une copie de chaque jour modifié est conservée 30 jours."
  pl: "Firma jest zapisywana po każdej zmianie. Kopia z każdego dnia zmian jest przechowywana przez 30 dni."
  ru: "Компания сохраняется после каждого изменения. Копия каждого дня с изменениями хранится 30 дней."
  uk: "Компанія зберігається після кожної зміни. Копія кожного дня зі змінами зберігається 30 днів."
"The driver is late until %{t}: %{name} drives the first trips.":
  nl: "De chauffeur is te laat tot %{t}: %{name} rijdt de eerste ritten."
  de: "Der Fahrer kommt erst um %{t}: %{name} fährt die ersten Fahrten."
  fr: "Le conducteur est en retard jusqu'à %{t} : %{name} assure les premières courses."
  pl: "Kierowca spóźni się do %{t}: pierwsze kursy jedzie %{name}."
  ru: "Водитель опаздывает до %{t}: первые рейсы ведёт %{name}."
  uk: "Водій запізнюється до %{t}: перші рейси веде %{name}."
"The drivers are planned on duties by the rules of their contract and their licence. Report illness here: the roster finds a replacement.":
  nl: "De chauffeurs worden op diensten ingepland volgens hun contract en rijbewijs. Meld hier ziekte: het rooster zoekt een vervanger."
  de: "Die Fahrer werden nach ihrem Vertrag und Führerschein auf Dienste geplant. Melden Sie hier Krankheit: der Dienstplan findet einen Ersatz."
  fr: "Les conducteurs sont planifiés selon leur contrat et leur permis. Signalez ici une maladie : le roulement trouve un remplaçant."
  pl: "Kierowcy są planowani na służby zgodnie z umową i prawem jazdy. Zgłoś tu chorobę: grafik znajdzie zastępstwo."
  ru: "Водители ставятся на смены по правилам договора и прав. Сообщите здесь о болезни: график найдёт замену."
  uk: "Водії ставляться на зміни за правилами договору та посвідчення. Повідомте тут про хворобу: графік знайде заміну."
