_version: 2
# The program's own texts: the dispatcher's reports, hired buses, the network's lines.
"Add drivers, record their licences and type trainings, or add buses.":
  de: "Fügen Sie Fahrer hinzu, erfassen Sie ihre Führerscheine und Typschulungen, oder fügen Sie Busse hinzu."
  fr: "Ajoutez des conducteurs, enregistrez leurs permis et formations de type, ou ajoutez des bus."
  nl: "Voeg chauffeurs toe, leg hun rijbewijzen en typeopleidingen vast, of voeg bussen toe."
  pl: "Dodaj kierowców, zapisz ich prawa jazdy i szkolenia typowe albo dodaj autobusy."
  ru: "Добавьте водителей, укажите их права и обучение по типам или добавьте автобусы."
  uk: "Додайте водіїв, зазначте їхні посвідчення та навчання за типами або додайте автобуси."
"Bus %{n} broke down: in the workshop today.":
  de: "Bus %{n} ist ausgefallen: heute in der Werkstatt."
  fr: "Le bus %{n} est en panne : à l'atelier aujourd'hui."
  nl: "Bus %{n} is defect: vandaag in de werkplaats."
  pl: "Autobus %{n} uległ awarii: dziś w warsztacie."
  ru: "Автобус %{n} сломался: сегодня в мастерской."
  uk: "Автобус %{n} зламався: сьогодні в майстерні."
"Cancel the hired bus":
  de: "Mietbus abbestellen"
  fr: "Annuler le bus loué"
  nl: "Ingehuurde bus annuleren"
  pl: "Anuluj wynajęty autobus"
  ru: "Отменить арендованный автобус"
  uk: "Скасувати орендований автобус"
"Choose another bus, or allow this kind of bus for the line on the Lines page.":
  de: "Wählen Sie einen anderen Bus oder erlauben Sie diese Busart für die Linie auf der Seite Linien."
  fr: "Choisissez un autre bus, ou autorisez ce type de bus pour la ligne sur la page Lignes."
  nl: "Kies een andere bus, of sta dit soort bus toe voor de lijn op de pagina Lijnen."
  pl: "Wybierz inny autobus albo zezwól na ten rodzaj autobusu dla linii na stronie Linie."
  ru: "Выберите другой автобус или разрешите этот тип автобуса для линии на странице «Линии»."
  uk: "Виберіть інший автобус або дозвольте цей тип автобуса для лінії на сторінці «Лінії»."
"Choose the bus that broke down.":
  de: "Wählen Sie den ausgefallenen Bus."
  fr: "Choisissez le bus en panne."
  nl: "Kies de bus die defect is."
  pl: "Wybierz autobus, który uległ awarii."
  ru: "Выберите сломавшийся автобус."
  uk: "Виберіть автобус, що зламався."
"Choose the driver who comes late.":
  de: "Wählen Sie den Fahrer, der zu spät kommt."
  fr: "Choisissez le conducteur en retard."
  nl: "Kies de chauffeur die te laat komt."
  pl: "Wybierz kierowcę, który się spóźni."
  ru: "Выберите водителя, который опаздывает."
  uk: "Виберіть водія, який запізнюється."
"From another operator":
  de: "Von einem anderen Unternehmen"
  fr: "D'un autre transporteur"
  nl: "Van een andere vervoerder"
  pl: "Od innego przewoźnika"
  ru: "У другого перевозчика"
  uk: "В іншого перевізника"
"Hire a bus for today":
  de: "Heute einen Bus anmieten"
  fr: "Louer un bus pour aujourd'hui"
  nl: "Vandaag een bus inhuren"
  pl: "Wynajmij autobus na dziś"
  ru: "Арендовать автобус на сегодня"
  uk: "Орендувати автобус на сьогодні"
"Hired bus":
  de: "Mietbus"
  fr: "Bus loué"
  nl: "Ingehuurde bus"
  pl: "Wynajęty autobus"
  ru: "Арендованный автобус"
  uk: "Орендований автобус"
"Hired buses cancelled.":
  de: "Mietbusse abbestellt."
  fr: "Bus loués annulés."
  nl: "Ingehuurde bussen geannuleerd."
  pl: "Wynajęte autobusy anulowane."
  ru: "Аренда автобусов отменена."
  uk: "Оренду автобусів скасовано."
"Never works on this weekday":
  de: "Arbeitet an diesem Wochentag nie"
  fr: "Ne travaille jamais ce jour de la semaine"
  nl: "Werkt nooit op deze weekdag"
  pl: "Nigdy nie pracuje w ten dzień tygodnia"
  ru: "Никогда не работает в этот день недели"
  uk: "Ніколи не працює в цей день тижня"
"No licence recorded for this kind of bus":
  de: "Keine Berechtigung für diese Busart erfasst"
  fr: "Aucune habilitation enregistrée pour ce type de bus"
  nl: "Geen bevoegdheid vastgelegd voor dit soort bus"
  pl: "Brak zapisanych uprawnień do tego rodzaju autobusu"
  ru: "Нет допуска к этому типу автобуса"
  uk: "Немає допуску до цього типу автобуса"
"Reported for this day":
  de: "Für diesen Tag gemeldet"
  fr: "Signalé pour ce jour"
  nl: "Gemeld voor deze dag"
  pl: "Zgłoszone na ten dzień"
  ru: "Сообщено на этот день"
  uk: "Повідомлено на цей день"
"Take my choice back":
  de: "Meine Wahl zurücknehmen"
  fr: "Annuler mon choix"
  nl: "Mijn keuze terugdraaien"
  pl: "Cofnij mój wybór"
  ru: "Отменить мой выбор"
  uk: "Скасувати мій вибір"
"The hired bus is cancelled.":
  de: "Der Mietbus ist abbestellt."
  fr: "Le bus loué est annulé."
  nl: "De ingehuurde bus is geannuleerd."
  pl: "Wynajęty autobus został anulowany."
  ru: "Аренда автобуса отменена."
  uk: "Оренду автобуса скасовано."
"The hired bus of line %{n}, tour %{tour} is cancelled.":
  de: "Der Mietbus der Linie %{n}, Umlauf %{tour} ist abbestellt."
  fr: "Le bus loué de la ligne %{n}, service %{tour} est annulé."
  nl: "De ingehuurde bus van lijn %{n}, omloop %{tour} is geannuleerd."
  pl: "Wynajęty autobus linii %{n}, obieg %{tour} został anulowany."
  ru: "Аренда автобуса линии %{n}, выход %{tour} отменена."
  uk: "Оренду автобуса лінії %{n}, випуск %{tour} скасовано."
"The line is no longer in the network: open the timetable again.":
  de: "Die Linie ist nicht mehr im Netz: Öffnen Sie den Fahrplan erneut."
  fr: "La ligne n'est plus dans le réseau : rouvrez l'horaire."
  nl: "De lijn staat niet meer in het netwerk: open de dienstregeling opnieuw."
  pl: "Linii nie ma już w sieci: otwórz rozkład ponownie."
  ru: "Линии больше нет в сети: откройте расписание заново."
  uk: "Лінії більше немає в мережі: відкрийте розклад знову."
"The line was changed meanwhile on the Lines page: it is shown as it is now.":
  de: "Die Linie wurde inzwischen auf der Seite Linien geändert: Sie wird so gezeigt, wie sie jetzt ist."
  fr: "La ligne a été modifiée entre-temps sur la page Lignes : elle est affichée telle qu'elle est maintenant."
  nl: "De lijn is intussen gewijzigd op de pagina Lijnen: ze wordt getoond zoals ze nu is."
  pl: "Linia została w międzyczasie zmieniona na stronie Linie: jest pokazana w obecnej postaci."
  ru: "Линия тем временем была изменена на странице «Линии»: она показана в текущем виде."
  uk: "Лінію тим часом змінено на сторінці «Лінії»: її показано в поточному вигляді."
"This pattern has fewer than two stops: give it its stops on the Lines page.":
  de: "Dieses Muster hat weniger als zwei Haltestellen: Geben Sie ihm seine Haltestellen auf der Seite Linien."
  fr: "Ce parcours a moins de deux arrêts : donnez-lui ses arrêts sur la page Lignes."
  nl: "Dit patroon heeft minder dan twee haltes: geef het zijn haltes op de pagina Lijnen."
  pl: "Ten wariant ma mniej niż dwa przystanki: dodaj przystanki na stronie Linie."
  ru: "У этого варианта меньше двух остановок: задайте остановки на странице «Линии»."
  uk: "У цього варіанта менше двох зупинок: задайте зупинки на сторінці «Лінії»."
