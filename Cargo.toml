[workspace]
resolver = "2"
members = ["crates/rosterflow-core", "crates/rosterflow-api", "crates/rosterflow-dev", "app"]
# (`cargo build` without -p builds the libraries and the browser server; the desktop app is `cargo build -p rosterflow`)
default-members = ["crates/rosterflow-core", "crates/rosterflow-api", "crates/rosterflow-dev"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
rosterflow-core = { path = "crates/rosterflow-core" }
rosterflow-api = { path = "crates/rosterflow-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
